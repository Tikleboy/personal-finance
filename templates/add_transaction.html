{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-6 col-md-8 col-12">
        <div class="genesis-card">
            <div class="genesis-card-header">
                <h3 class="mb-0">Add Transaction</h3>
            </div>

            <div class="genesis-card-body">
                <form method="POST">
                    
                    <!-- Date Input -->
                    <div class="form-group">
                        <label class="form-label-genesis" for="date">Date</label>
                        <input type="date" id="date" name="date" class="form-control-genesis" required>
                    </div>

                    <!-- Type Select -->
                    <div class="form-group">
                        <label class="form-label-genesis" for="type">Type</label>
                        <select name="type" id="type" class="form-select-genesis" required>
                            <option value="">Select Type</option>
                            <option value="Pemasukan">Pemasukan</option>
                            <option value="Pengeluaran">Pengeluaran</option>
                        </select>
                    </div>

                    <!-- Category Select -->
                    <div class="form-group">
                        <label class="form-label-genesis" for="category">Category</label>
                        <select name="category" id="category" class="form-select-genesis" required>
                            <option value="">Select Category</option>
                            {% for category in categories %}
                                <option value="{{ category['Category'] }}" data-type="{{ category['Type'] }}">
                                    {{ category['Category'] }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Amount Input -->
                    <div class="form-group">
                        <label class="form-label-genesis" for="amount">Amount (Rp)</label>
                        <input type="number" id="amount" name="amount" class="form-control-genesis font-mono" min="0" placeholder="0" required>
                    </div>

                    <!-- Description Input -->
                    <div class="form-group mb-4">
                        <label class="form-label-genesis" for="description">Description</label>
                        <textarea id="description" name="description" class="form-control-genesis" rows="3" placeholder="Contoh: Makan siang"></textarea>
                    </div>

                    <!-- Form Actions -->
                    <div class="d-flex justify-content-end gap-2 form-actions-wrapper">
                        <a href="{{ url_for('transactions') }}" class="btn-genesis btn-genesis-secondary btn-genesis-md">
                            Cancel
                        </a>
                        <button type="submit" class="btn-genesis btn-genesis-primary btn-genesis-md">
                            Save Transaction
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>

<script>
const typeSelect = document.getElementById("type");
const categorySelect = document.getElementById("category");

if (typeSelect && categorySelect) {
    typeSelect.addEventListener("change", function () {
        const selectedType = this.value;
        const options = categorySelect.querySelectorAll("option");

        options.forEach(option => {
            if (!option.dataset.type) {
                return;
            }

            if (option.dataset.type === selectedType) {
                option.style.display = "block";
            } else {
                option.style.display = "none";
            }
        });

        categorySelect.value = "";
    });
}
</script>

{% endblock %}
