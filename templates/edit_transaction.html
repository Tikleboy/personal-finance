{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-6 col-md-8 col-12">
        <div class="genesis-card">
            <div class="genesis-card-header">
                <h3 class="mb-0">Edit Transaction</h3>
            </div>

            <div class="genesis-card-body">
                <form method="POST">
                    
                    <!-- Date Input -->
                    <div class="form-group">
                        <label class="form-label-genesis" for="date">Date</label>
                        <input type="date" id="date" name="date" class="form-control-genesis" value="{{ transaction['Date'] }}" required>
                    </div>

                    <!-- Type Select -->
                    <div class="form-group">
                        <label class="form-label-genesis" for="type">Type</label>
                        <select name="type" id="type" class="form-select-genesis" required>
                            <option value="Pemasukan" {% if transaction['Type'] == 'Pemasukan' %} selected {% endif %}>
                                Pemasukan
                            </option>
                            <option value="Pengeluaran" {% if transaction['Type'] == 'Pengeluaran' %} selected {% endif %}>
                                Pengeluaran
                            </option>
                        </select>
                    </div>

                    <!-- Category Select -->
                    <div class="form-group">
                        <label class="form-label-genesis" for="category">Category</label>
                        <select name="category" id="category" class="form-select-genesis" required>
                            {% for category in categories %}
                                <option value="{{ category['Category'] }}" 
                                        data-type="{{ category['Type'] }}" 
                                        {% if category['Category'] == transaction['Category'] %} selected {% endif %}>
                                    {{ category['Category'] }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Amount Input -->
                    <div class="form-group">
                        <label class="form-label-genesis" for="amount">Amount (Rp)</label>
                        <input type="number" id="amount" name="amount" class="form-control-genesis font-mono" value="{{ transaction['Amount'] }}" min="0" required>
                    </div>

                    <!-- Description Input -->
                    <div class="form-group mb-4">
                        <label class="form-label-genesis" for="description">Description</label>
                        <textarea id="description" name="description" class="form-control-genesis" rows="3">{{ transaction['Description'] }}</textarea>
                    </div>

                    <!-- Form Actions -->
                    <div class="d-flex justify-content-end gap-2 form-actions-wrapper">
                        <a href="{{ url_for('transactions') }}" class="btn-genesis btn-genesis-secondary btn-genesis-md">
                            Cancel
                        </a>
                        <button type="submit" class="btn-genesis btn-genesis-primary btn-genesis-md">
                            Update Transaction
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>

<script>
const typeSelect = document.getElementById("type");
const categorySelect = document.getElementById("category");

function filterCategories() {
    if (!typeSelect || !categorySelect) return;

    const selectedType = typeSelect.value;
    const options = categorySelect.querySelectorAll("option");

    options.forEach(option => {
        const optionType = option.dataset.type;
        if (!optionType) return;

        if (optionType === selectedType) {
            option.style.display = "block";
        } else {
            option.style.display = "none";
        }
    });
}

if (typeSelect && categorySelect) {
    typeSelect.addEventListener("change", filterCategories);
    filterCategories();
}
</script>

{% endblock %}
