<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Finance — Genesis Edition</title>
    
    <!-- Speed Optimization: DNS Prefetch & Preconnect -->
    <link rel="dns-prefetch" href="https://api.fontshare.com">
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Genesis Fonts -->
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@700,600,500&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Bootstrap CSS for grid compatibility -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-grid.min.css" rel="stylesheet">
    
    <!-- Custom Genesis Style -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- Genesis Sticky Navbar -->
    <header class="genesis-navbar">
        <div class="genesis-nav-container">
            <a class="genesis-brand" href="{{ url_for('dashboard') }}">
                <span class="genesis-brand-badge">PF</span>
                <span>Personal Finance</span>
            </a>

            <!-- Desktop Links -->
            <nav class="genesis-nav-links">
                <a class="genesis-nav-link {% if request.endpoint == 'dashboard' %}active{% endif %}" href="{{ url_for('dashboard') }}">
                    Dashboard
                </a>
                <a class="genesis-nav-link {% if request.endpoint == 'transactions' %}active{% endif %}" href="{{ url_for('transactions') }}">
                    Transactions
                </a>
            </nav>

            <!-- Mobile Hamburger Toggle -->
            <button class="genesis-mobile-toggle" id="mobileNavToggle" aria-label="Toggle Navigation">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
        </div>

        <!-- Mobile Drawer -->
        <div class="mobile-nav-drawer" id="mobileNavDrawer">
            <a class="genesis-nav-link {% if request.endpoint == 'dashboard' %}active{% endif %}" href="{{ url_for('dashboard') }}">
                Dashboard
            </a>
            <a class="genesis-nav-link {% if request.endpoint == 'transactions' %}active{% endif %}" href="{{ url_for('transactions') }}">
                Transactions
            </a>
        </div>
    </header>

    <!-- Main Container -->
    <main class="genesis-container">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Mobile Nav JavaScript -->
    <script>
        const navToggle = document.getElementById('mobileNavToggle');
        const navDrawer = document.getElementById('mobileNavDrawer');

        if (navToggle && navDrawer) {
            navToggle.addEventListener('click', () => {
                navDrawer.classList.toggle('open');
            });
        }
    </script>
</body>
</html>
